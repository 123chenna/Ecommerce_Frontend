<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            margin: 0;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; }

        .section { margin-bottom: 20px; }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .total-box {
            font-size: 18px;
            font-weight: bold;
            color: green;
            text-align: right;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover { background: #218838; }

        .payment { display: flex; gap: 20px; }
    </style>
</head>

<body>

<div class="container">
    <h2>🧾 Checkout</h2>

    <!-- SHIPPING -->
    <div class="section">
        <h3>Shipping Details</h3>
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="address" placeholder="Address">
        <input type="text" id="phone" placeholder="Phone Number">
    </div>

    <!-- PAYMENT -->
    <div class="section">
        <h3>Payment Method</h3>
        <div class="payment">
            <label><input type="radio" name="payment" value="COD" checked> COD</label>
            <label><input type="radio" name="payment" value="ONLINE PAYMENT"> Online</label>
        </div>
    </div>

    <!-- TOTAL -->
    <div id="total" class="total-box">Total: ₹0</div>

    <!-- BUTTON -->
    <button class="btn" onclick="placeOrder()">Place Order</button>
</div>

<script>

// ✅ GET LOGGED-IN USER
const username = localStorage.getItem("username");

// ❗ Check login
if (!username) {
    alert("Please login first");
    window.location.href = "login.html";
}

// ✅ LOAD TOTAL FROM CART
async function loadTotal() {
    try {
        const res = await fetch(`https://ecommerce-backend-5rta.onrender.com/cart/${username}`);
        const data = await res.json();

        let total = 0;
        data.forEach(item => {
            total += item.price * item.quantity;
        });

        document.getElementById("total").innerText = "Total: ₹" + total;
    } catch (err) {
        console.error("Cart error:", err);
    }
}

// ✅ PLACE ORDER
async function placeOrder() {

    const name = document.getElementById("name").value;
    const address = document.getElementById("address").value;
    const phone = document.getElementById("phone").value;
    const payment = document.querySelector('input[name="payment"]:checked').value;

    if (!name || !address || !phone) {
        alert("Please fill all details ❗");
        return;
    }

    // GET CART ITEMS
    const res = await fetch(`https://ecommerce-backend-5rta.onrender.com/cart/${username}`);
    const cartItems = await res.json();

    const total = cartItems.reduce((sum, i) => sum + i.price * i.quantity, 0);

    // ✅ CORRECT ORDER OBJECT
    const order = {
        username: username, // 🔥 FIXED
        name: name,
        address: address,
        phone: phone,
        payment: payment,
        total: total
    };

    // SAVE ORDER
    await fetch("https://ecommerce-backend-5rta.onrender.com/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
    });

    alert("✅ Order placed successfully!");

    // CLEAR CART
    await fetch(`https://ecommerce-backend-5rta.onrender.com/cart/clear/${username}`, {
        method: "DELETE"
    });

    window.location.href = "orders.html";
}

loadTotal();

</script>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Login - MyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #131921, #232f3e);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
    }

    .card {
      width: 350px;
      border-radius: 12px;
    }

    .title {
      text-align: center;
      font-weight: bold;
      color: #131921;
    }
  </style>
</head>

<body>

<div class="card p-4 shadow">

  <h3 class="title">Login</h3>

  <input id="username" class="form-control mt-3" placeholder="Username">

  <input id="password" type="password" class="form-control mt-2" placeholder="Password">

  <button class="btn btn-warning mt-3 w-100" onclick="login()">Login</button>

  <p class="text-center mt-3">
    New user? <a href="register.html">Register</a>
  </p>

</div>

<script>

function login(){

  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;

  if(!username || !password){
    alert("Enter username & password ❌");
    return;
  }

  fetch("http://localhost:8080/auth/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username, password})
  })
  .then(res=>res.text())
  .then(token=>{

    // ❌ If user not found
    if(token.includes("not found")){
      alert("User not registered ❌");
      window.location.href="register.html";
    }

    // ❌ Wrong password
    else if(token.includes("Invalid")){
      alert("Wrong password ❌");
    }

    // ✅ Success
    else{
      localStorage.setItem("username", username);
      localStorage.setItem("token", token);

      alert("Login Successful ✅");
      window.location.href="index.html";
    }

  })
  .catch(()=>alert("Login failed ❌"));
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(120deg,#eef2f7,#dfe9f3);
    font-family: 'Segoe UI', sans-serif;
}

/* HEADER */
.header {
    background: burlywood;
    color:white;
    padding:18px 25px;
    border-radius:0 0 15px 15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

/* CARD */
.card {
    border:none;
    border-radius:20px;
    background: rgba(255,255,255,0.9);
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover {
    transform:translateY(-8px);
}

/* IMAGE */
.card img {
    height:150px;
    object-fit:contain;
    cursor:pointer;
}

/* BADGE */
.badge-category {
    background: linear-gradient(to right,#0072ff,#00c6ff);
    color:white;
    padding:5px 10px;
    border-radius:20px;
}

/* BUTTONS */
.btn-success {
    background: linear-gradient(to right,#28a745,#20c997);
    border:none;
}

.btn-delete {
    background: linear-gradient(to right,#ff416c,#ff4b2b);
    color:white;
    border:none;
}

/* ORDER CARD */
.order-card {
    border-left:5px solid #28a745;
}

/* TITLE */
.section-title {
    font-weight:bold;
    margin:25px 0 15px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header d-flex justify-content-between align-items-center">
    <h4>🚀 Admin Dashboard</h4>
    <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
</div>

<div class="container mt-4">

<!-- STATS -->
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h6>Total Products</h6>
            <h2 id="totalProducts">0</h2>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h6>Total Orders</h6>
            <h2 id="totalOrders">0</h2>
        </div>
    </div>
</div>

<!-- ADD PRODUCT -->
<div class="card p-4 mb-4">
    <h5>Add Product</h5>
    <div class="row g-3">
        <div class="col-md-2"><input id="name" class="form-control" placeholder="Name"></div>
        <div class="col-md-1"><input id="price" class="form-control" placeholder="Price"></div>
        <div class="col-md-2"><input id="image" class="form-control" placeholder="Image URL"></div>
        <div class="col-md-2"><input id="category" class="form-control" placeholder="Category"></div>
        <div class="col-md-3"><input id="description" class="form-control" placeholder="Description"></div>
       <!-- REPLACE ONLY BUTTON SECTION -->
<div class="col-md-2">
    <div class="d-flex gap-2">
        <button class="btn btn-success" onclick="addProduct()">➕ Add</button>
        <button class="btn btn-warning" onclick="updateProduct()">✏️ Update</button>
    </div>
</div>
    
</div>

<!-- PRODUCTS -->
<div class="section-title">Products</div>
<div class="row" id="products"></div>

<!-- ORDERS -->
<div class="section-title">Orders</div>
<div class="row" id="orders"></div>

</div>

<script>
const API="http://localhost:8080/products";
const ORDER_API="http://localhost:8080/orders";

/* LOGOUT */
function logout(){
    localStorage.removeItem("admin");
    window.location.href="index.html";
}

/* VIEW PRODUCT */
function viewProduct(id){
    window.location.href="product.html?id="+id;
}

/* LOAD PRODUCTS */
async function loadProducts(){
    const res=await fetch(API);
    const data=await res.json();

    totalProducts.innerText=data.length;
    products.innerHTML="";

    data.forEach(p=>{
        products.innerHTML+=`
        <div class="col-md-3 mb-3">
            <div class="card p-3 text-center">

                <img src="${p.image}" onclick="viewProduct(${p.id})">

                <h6 class="mt-2">${p.name}</h6>
                <p>₹${p.price}</p>

               
               <div class="d-flex justify-content-center gap-2 mt-2">
    <button class="btn btn-delete btn-sm"
        onclick="deleteProduct(${p.id})">
        🗑 Delete
    </button>

    <button class="btn btn-primary btn-sm edit-btn"
        onclick="editProduct(${p.id})">
        ✏️ Edit
    </button>
</div>
        </div>

            </div>
        </div>`;
    });
}


/* ADD PRODUCT */
async function addProduct(){
    const name=document.getElementById("name");
    const price=document.getElementById("price");
    const image=document.getElementById("image");
    const category=document.getElementById("category");
    const description=document.getElementById("description");

    await fetch(API,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name:name.value,
            price:price.value,
            image:image.value,
            category:category.value,
            description:description.value
        })
    });

    // CLEAR INPUTS
    name.value="";
    price.value="";
    image.value="";
    category.value="";
    description.value="";

    loadProducts();
}

/* DELETE */
async function deleteProduct(id){
    await fetch(API+"/"+id,{method:"DELETE"});
    loadProducts();
}
//edit product
async function editProduct(id) {
    let res = await fetch(`http://localhost:8080/products/${id}`);
    let p = await res.json();

    document.getElementById("name").value = p.name;
    document.getElementById("price").value = p.price;
    document.getElementById("description").value = p.description;
    document.getElementById("image").value = p.image;
    document.getElementById("category").value = p.category;

    window.editId = id; // store id
}
//update product
async function updateProduct() {

    // ❌ If user didn't click edit
    if (!window.editId) {
        alert("Please click Edit first!");
        return;
    }

    // ✅ Get values properly
    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;
    const image = document.getElementById("image").value;
    const category = document.getElementById("category").value;
    const description = document.getElementById("description").value;

    // ✅ API call
    await fetch(`http://localhost:8080/products/${window.editId}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            price: price,
            image: image,
            category: category,
            description: description
        })
    });

    // ✅ Success
    alert("Product Updated ✅");

    // 🔥 Reset edit mode
    window.editId = null;

    // 🔥 Clear inputs
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("category").value = "";
    document.getElementById("description").value = "";

    // 🔥 Reload products
    loadProducts();
}
/* LOAD ORDERS */
async function loadOrders(){
    const res=await fetch(ORDER_API);
    const data=await res.json();

    totalOrders.innerText=data.length;
    orders.innerHTML="";

    data.forEach(o=>{
        orders.innerHTML+=`
        <div class="col-md-4 mb-3">
            <div class="card order-card p-3">
                <h6>Order #${o.id}</h6>
                <p><b>UserName:</b> ${o.username}</p>
                <p><b>Address:</b> ${o.address|| "Placed"}</p>
                <p><b>Total:</b> ₹${o.total}</p>
                <p><b>Status:</b> ${o.status || "Placed"}</p>
                
            </div>
        </div>`;
    });
}

/* INIT */
loadProducts();
loadOrders();
</script>

</body>
</html>
